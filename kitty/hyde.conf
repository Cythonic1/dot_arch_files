# This is the configuration file for kitty terminal
# For more information, see https://sw.kovidgoyal.net/kitty/conf.html
# For your custom configurations, put it in ./kitty.conf
font_family CaskaydiaCove Nerd Font Mono
# font_family Monocraft Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
enable_audio_bell no
font_size 9.0
window_padding_width 5
window_padding_hight 5
# cursor_trail 5
cursor_trail 1
font_size 16.0
shell zsh
# include graphite.conf
# include	Dracula.conf
# include Afterglow.conf
# include themes/Rose_Pine_Moon.conf
# include Catppuccin-Mocha.conf
# include themes/oxo_theme.conf
include themes/Rose_Pine_Moon.conf

background_opacity 0.20
background_blur 5
hide_window_decorations yes
confirm_os_window_close 0
